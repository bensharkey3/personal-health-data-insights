[project]
name = "personal-health-data-insights"
version = "0.1.0"
description = "Personal health data pipeline on AWS"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "boto3>=1.44.8",
    "pytest",
    "ruff",
    { include-group = "lambda" }, # tests import duckdb
]
lambda = [
    "duckdb==2.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"] # so tests import ingest.* the way Lambda does
