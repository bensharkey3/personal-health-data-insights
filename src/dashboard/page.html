<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Health</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #667085; --line: #4f6bed;
          --green: #1f9d55; --amber: #d98e04; --red: #d14343; --grey: #98a2b3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11151c; --card: #1b212b; --text: #e6e9ef; --muted: #98a2b3; --line: #8ea2ff; }
  }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 15px/1.4 system-ui, -apple-system, sans-serif; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.1rem; margin: 0 0 12px; color: var(--muted); font-weight: 500; }
  h2 { font-size: 1rem; margin: 20px 0 8px; }
  .ready { display: flex; gap: 12px; align-items: center; background: var(--card);
           border-radius: 12px; padding: 14px; }
  .light { width: 28px; height: 28px; border-radius: 50%; flex: none; background: var(--$colour); }
  .ill { background: var(--card); border-left: 4px solid var(--red); padding: 10px 12px;
         border-radius: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .card { background: var(--card); border-radius: 12px; padding: 10px 12px; }
  .card h3 { margin: 0; font-size: .8rem; color: var(--muted); font-weight: 500; }
  .card p { margin: 2px 0; font-size: .75rem; color: var(--muted); }
  .card .v { font-size: 1.3rem; color: var(--text); font-weight: 600; }
  .card.worse .v { color: var(--red); }
  .card.stale, .card.none { opacity: .55; }
  .spark { width: 100%; height: 28px; }
  .spark polyline { fill: none; stroke: var(--line); stroke-width: 1.5; }
  .wx { width: 100%; background: var(--card); border-radius: 12px; padding: 8px;
        font-size: .85rem; border-spacing: 6px 4px; }
  .wx th { text-align: left; font-weight: 500; }
  footer { margin: 24px 0 8px; font-size: .75rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>$today</h1>
  <div class="ready"><div class="light" title="$colour"></div><div>$reason</div></div>
  $illness
  <h2>Weather and air</h2>
  $weather
  <h2>Compared with usual</h2>
  <div class="grid">$cards</div>
  <footer>Usual = middle half of the previous 30 days. ▲▼ outside it.
    Weather and air quality: Open-Meteo.com (CC BY 4.0). Built $built_at.</footer>
</main>
</body>
</html>
