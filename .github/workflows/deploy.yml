name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy # never two applies at once
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # lets the job get an OIDC token to assume the AWS apply role

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production # waits for approval in GitHub before any step runs
    defaults:
      run:
        working-directory: infra
        shell: bash # adds -o pipefail, so a failing plan in "plan | tee" fails the step
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt
      - run: |
          { echo '### Applied plan'; echo '```'; grep -E '^(Plan:|No changes|  [#+~-])' plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - run: terraform apply -input=false tfplan
