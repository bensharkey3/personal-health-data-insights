name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy # never two applies at once
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # lets the job get an OIDC token to assume the AWS apply role

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production # main only; no required reviewer while in development (D21)
    defaults:
      run:
        working-directory: infra
        shell: bash # adds -o pipefail, so a failing plan in "plan | tee" fails the step
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_time_zone: ${{ secrets.TIME_ZONE }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@v10.4.0
      # DuckDB layer for Lambda (arm64, Python 3.12), zipped by Terraform (D10)
      - run: |
          uv export --only-group lambda --no-hashes --no-emit-project > build-req.txt
          uv pip install -r build-req.txt --target build/layer/python --python-platform aarch64-manylinux_2_28 --python-version 3.12 --only-binary :all:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ap-southeast-2
      # Public repo: hide the account ID and bucket names from the logs before Terraform prints them.
      - run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
      - run: echo "::add-mask::$(terraform output -raw raw_bucket 2>/dev/null)"
      - run: echo "::add-mask::$(terraform output -raw site_bucket 2>/dev/null)"
      - run: | # the dashboard address: never in logs (D34)
          d=$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='phdi-dashboard'].DomainName | [0]" --output text 2>/dev/null)
          if [ -n "$d" ] && [ "$d" != "None" ]; then echo "::add-mask::$d"; fi
      - run: echo "::add-mask::$(aws lambda get-function-url-config --function-name phdi-google-health-webhook --query FunctionUrl --output text 2>/dev/null)"
      - run: echo "::add-mask::$(aws lambda get-function-url-config --function-name phdi-tasker --query FunctionUrl --output text 2>/dev/null)"
      - run: echo "::add-mask::$(aws lambda get-function-url-config --function-name phdi-refresh --query FunctionUrl --output text 2>/dev/null)"
      - run: | # refresh URL (D37), until its destroy is applied: the URL, its host and its ID
          u=$(aws lambda get-function-url-config --function-name phdi-refresh --query FunctionUrl --output text 2>/dev/null) || exit 0
          h=${u#https://}; h=${h%/}; echo "::add-mask::$h"; echo "::add-mask::${h%%.*}"
      - run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt
      - run: |
          { echo '### Applied plan'; echo '```'; grep -E '^(Plan:|No changes|  [#+~-])' plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - run: terraform apply -input=false tfplan
      - run: | # republish the dashboard with the new code (D33), then fetch fresh weather, which rebuilds again; async
          aws lambda invoke --function-name phdi-transform --invocation-type Event \
            --cli-binary-format raw-in-base64-out --payload '{"source": "weather"}' /dev/null
          aws lambda invoke --function-name phdi-weather --invocation-type Event \
            --cli-binary-format raw-in-base64-out --payload '{}' /dev/null
