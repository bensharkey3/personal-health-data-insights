name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [infra, infra/bootstrap]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for the read-only AWS plan role
    defaults:
      run:
        working-directory: infra
        shell: bash # adds -o pipefail, so a failing plan in "plan | tee" fails the step
    env:
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_time_zone: ${{ secrets.TIME_ZONE }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@v10.4.0
      # DuckDB layer for Lambda (arm64, Python 3.12), zipped by Terraform (D10)
      - run: |
          uv export --only-group lambda --no-hashes --no-emit-project > build-req.txt
          uv pip install -r build-req.txt --target build/layer/python --python-platform aarch64-manylinux_2_28 --python-version 3.12 --only-binary :all:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-southeast-2
      # Public repo: hide the account ID and bucket names from the logs before Terraform prints them.
      - run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
      - run: echo "::add-mask::$(terraform output -raw raw_bucket 2>/dev/null)"
      - run: echo "::add-mask::$(terraform output -raw site_bucket 2>/dev/null)"
      - run: | # the dashboard address: never in logs (D34)
          d=$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='phdi-dashboard'].DomainName | [0]" --output text 2>/dev/null)
          if [ -n "$d" ] && [ "$d" != "None" ]; then echo "::add-mask::$d"; fi
      - run: echo "::add-mask::$(aws lambda get-function-url-config --function-name phdi-google-health-webhook --query FunctionUrl --output text 2>/dev/null)"
      - run: echo "::add-mask::$(aws lambda get-function-url-config --function-name phdi-tasker --query FunctionUrl --output text 2>/dev/null)"
      - run: echo "::add-mask::$(aws lambda get-function-url-config --function-name phdi-refresh --query FunctionUrl --output text 2>/dev/null)"
      - run: echo "::add-mask::$(aws lambda get-function-url-config --function-name phdi-refresh --query FunctionUrl --output text 2>/dev/null | sed 's#^https://##; s#/$##')"
      - run: terraform plan -input=false -no-color -lock-timeout=60s | tee plan.txt
      - run: |
          { echo '### Terraform plan'; echo '```'; grep -E '^(Plan:|No changes|  [#+~-])' plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
